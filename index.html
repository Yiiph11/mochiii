<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mochhichi Time Rescate de Higiene</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.12);
            --border: rgba(255, 255, 255, 0.2);
            --accent: #f9d423;
            --correct: #2ecc71;
            --incorrect: #e74c3c;
        }
        * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
        body {
            background: #0a0a14;
            font-family: 'Comfortaa', cursive;
            display: flex; justify-content:center; align-items:center;
            min-height:100vh; overflow:hidden; touch-action:manipulation;
        }
        #game-container {
            position:relative; width:100vw; height:100vh;
            max-width:450px; max-height:900px; overflow:hidden;
            border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.7);
        }
        #bg-image {
            position:absolute; top:0; left:0; width:100%; height:100%;
            object-fit:cover; z-index:1;
            background: url('fondomochi.png') center/cover no-repeat;
        }
        #bg-overlay {
            position:absolute; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.3); z-index:2;
        }
        #char-layer {
            position:absolute; bottom:20%; width:100%; display:flex; justify-content:center; z-index:4; pointer-events:none;
        }
        #char-sprite {
            max-width: 65%; 
            max-height: 40vh; 
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            transition: 0.5s;
            content: url('monchhichi-cabezon.png');
            margin-bottom: 150px; 
        }

        }
        #char-sprite.bounce { animation:bounce 0.5s; }
        #char-sprite.sad { animation:sad 0.7s; }
        #char-sprite.celebrate { animation:celebrate 0.7s; }
        #char-sprite.dirty { filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5)) sepia(0.5) hue-rotate(30deg); }
        .hidden { display:none !important; }

        /* Barra de higiene */
        #hygiene-bar-container {
            position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:6;
            width:80%; max-width:300px; display:flex; align-items:center; gap:8px;
        }
        #hygiene-label { color:#fff; font-weight:700; font-size:0.8rem; }
        #hygiene-bar-outer {
            flex:1; height:12px; background:rgba(0,0,0,0.5); border-radius:20px; overflow:hidden;
            border:2px solid rgba(255,255,255,0.3);
        }
        #hygiene-bar-inner {
            height:100%; width:50%; background:linear-gradient(90deg, #e74c3c, #f9d423, #2ecc71);
            border-radius:20px; transition:width 0.5s;
        }

        /* Minijuegos */
        #minigame-layer {
            position:absolute; top:0; left:0; width:100%; height:100%; z-index:10;
            display:none; flex-direction:column; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.85); backdrop-filter:blur(8px);
        }
        #minigame-layer.active { display:flex; }
        #mg-canvas { border-radius:20px; border:3px dashed rgba(255,255,255,0.4); background:rgba(255,255,255,0.05); cursor:pointer; touch-action:none; }
        .mg-progress { width:250px; height:8px; background:rgba(255,255,255,0.2); border-radius:20px; margin-top:15px; overflow:hidden; }
        .mg-progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#f9d423,#2ecc71); border-radius:20px; transition:0.3s; }
        .mg-counter { color:#fff; font-size:1.1rem; margin-top:10px; font-weight:600; }
        .mg-instruction { color:rgba(255,255,255,0.7); font-size:0.85rem; margin-top:8px; text-align:center; }

        /* UI */
        #ui-layer { position:relative; z-index:5; height:100%; width:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:16px; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:auto; }
        .glass { background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:16px; color:#fff; box-shadow:0 8px 32px rgba(0,0,0,0.2); }
        .tag { padding:8px 14px; font-size:0.78rem; font-weight:700; }
        .badge { padding:8px 14px; font-family:'Fredoka One',sans-serif; background:rgba(46,204,113,0.2); border-color:rgba(46,204,113,0.4); font-size:0.85rem; }
        .home-btn { padding:8px 12px; font-size:1.2rem; cursor:pointer; background:rgba(255,255,255,0.15); border:1px solid var(--border); border-radius:12px; color:#fff; transition:0.3s; }
        .home-btn:hover { background:rgba(255,255,255,0.3); }
        .fact-bubble { padding:10px 14px; margin-bottom:6px; font-size:0.8rem; text-align:center; background:rgba(255,215,0,0.1); border-color:rgba(255,215,0,0.3); display:none; animation:fadeInUp 0.5s; line-height:1.4; }
        .fact-bubble.show { display:block; }
        .dialogue-box { padding:14px 16px; margin-bottom:8px; position:relative; }
        #speaker-name { position:absolute; top:-14px; left:16px; background:linear-gradient(45deg,#00b4db,#0083b0); padding:4px 14px; border-radius:20px; font-weight:700; font-size:0.8rem; }
        .dialogue-text { font-size:0.9rem; line-height:1.6; min-height:48px; margin-top:4px; }
        #choices-container { display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
        .choice-btn {
            width:100%; padding:14px 16px; text-align:left; font-family:'Comfortaa',cursive;
            font-size:0.9rem; font-weight:700; cursor:pointer; transition:0.25s;
            border-radius:14px; background:var(--glass);
            backdrop-filter:blur(10px); border:1px solid var(--border); color:#fff;
            display:flex; align-items:center; gap:10px;
        }
        .choice-btn:hover { background:rgba(255,255,255,0.18); transform:translateX(4px); border-color:var(--accent); }
        .choice-btn.correct { background:rgba(46,204,113,0.35); border-color:var(--correct); }
        .choice-btn.incorrect { background:rgba(231,76,60,0.35); border-color:var(--incorrect); }
        .choice-btn:disabled { opacity:0.7; }
        .feedback-msg {
            background:rgba(255,255,255,0.12); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.2);
            border-radius:12px; color:#fff; padding:12px 14px; margin-bottom:8px; font-size:0.85rem;
            font-weight:600; text-align:center; animation:fadeInUp 0.4s; line-height:1.5;
        }

        /* Pantalla final */
        #final-screen {
            position:absolute; top:0; left:0; width:100%; height:100%; z-index:20;
            display:none; flex-direction:column; align-items:center; justify-content:center;
            background:rgba(0,0,0,0.9); backdrop-filter:blur(12px); color:#fff; text-align:center; padding:30px;
        }
        #final-screen.active { display:flex; }
        #final-screen h2 { font-family:'Fredoka One',cursive; font-size:2rem; margin-bottom:15px; }
        #final-screen button { background:rgba(255,255,255,0.2); border:1px solid #fff; color:#fff; padding:12px 30px; border-radius:30px; font-family:'Fredoka One',cursive; font-size:1.1rem; cursor:pointer; }

        @keyframes bounce { 0%,100%{transform:translateY(0)scale(1);} 40%{transform:translateY(-18px)scale(1.06);} }
        @keyframes sad { 0%,100%{transform:translateY(0);} 50%{transform:translateY(12px)scale(0.94);} }
        @keyframes celebrate { 0%,100%{transform:scale(1);} 30%{transform:scale(1.2)rotate(5deg);} }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
    </style>
</head>
<body>
<div id="game-container">
    <div id="bg-image"></div>
    <div id="bg-overlay"></div>
    <div id="hygiene-bar-container">
        <span id="hygiene-label">🧼</span>
        <div id="hygiene-bar-outer"><div id="hygiene-bar-inner"></div></div>
        <span id="hygiene-value" style="color:#fff;font-weight:700;">50</span>
    </div>
    <div id="char-layer"><img id="char-sprite" alt="Mochhichi"></div>

    <div id="minigame-layer">
        <canvas id="mg-canvas" width="300" height="300"></canvas>
        <div class="mg-progress"><div class="mg-progress-fill" id="mg-progress-fill"></div></div>
        <div class="mg-counter" id="mg-counter">0/4</div>
        <div class="mg-instruction" id="mg-instruction"></div>
    </div>

    <div id="final-screen">
        <h2 id="final-title"></h2>
        <p id="final-message"></p>
        <p style="margin:10px 0;">🧼 Higiene: <span id="final-hygiene">50</span>/100</p>
        
    </div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="tag glass" id="chapter-tag">Cap 1 · Acto 1</div>
            
            <div class="badge glass">🧼 <span id="completed-count">0</span>/21</div>
        </div>
        <div class="fact-bubble glass" id="fact-box">💡 <span id="fact-text"></span></div>
        <div class="dialogue-box glass">
            <div id="speaker-name">Mochhichi</div>
            <p class="dialogue-text" id="dialogue-text"></p>
        </div>
        <div id="choices-container"></div>
    </div>
</div>

<script>
    // ========== VARIABLES GLOBALES ==========
    const TOTAL_ACTS = 21;
    let currentActId = 'c1a1';
    let completedActs = 0;
    let hygieneScore = 50; // 0-100
    let gameFinished = false;
    let actInProgress = false;
    let decisionsLog = []; // Para App Inventor

    // Minijuego
    let mgActive = false, mgType = '', mgScore = 0, mgTarget = 5;
    let mgObjects = [], mgAnimId, mgTouchStart = null, mgDrawingPoints = [];
    const mgTargets = { tap:5, drag:5, swipe:6, circle:4, shake:8 };

    // DOM
    const $ = id => document.getElementById(id);
    const domTag = $('chapter-tag'), domSpeaker = $('speaker-name'), domDialogue = $('dialogue-text');
    const domChar = $('char-sprite'), domChoices = $('choices-container');
    const domCompleted = $('completed-count'), domFactBox = $('fact-box'), domFactText = $('fact-text');
    const domMgLayer = $('minigame-layer'), domMgCanvas = $('mg-canvas');
    const domMgProgress = $('mg-progress-fill'), domMgCounter = $('mg-counter');
    const domMgInstr = $('mg-instruction');
    const domFinal = $('final-screen'), domFinalTitle = $('final-title');
    const domFinalMsg = $('final-message'), domFinalHygiene = $('final-hygiene');
    const domHygieneBar = $('hygiene-bar-inner'), domHygieneValue = $('hygiene-value');
    const mgCtx = domMgCanvas.getContext('2d');

    // ========== APP INVENTOR ==========
    function saveToAppInventor() {
        const data = JSON.stringify({
            act: currentActId, completed: completedActs, hygiene: hygieneScore, decisions: decisionsLog
        });
        if (window.AppInventor) window.AppInventor.setWebViewString(data);
    }

    function loadFromAppInventor() {
        if (window.AppInventor && window.AppInventor.getWebViewString) {
            const str = window.AppInventor.getWebViewString();
            if (str) {
                try {
                    const d = JSON.parse(str);
                    if (d.act && storyData[d.act]) {
                        currentActId = d.act;
                        completedActs = d.completed || 0;
                        hygieneScore = d.hygiene || 50;
                        decisionsLog = d.decisions || [];
                        return true;
                    }
                } catch(e) {}
            }
        }
        return false;
    }

    function updateHygieneUI() {
        hygieneScore = Math.max(0, Math.min(100, hygieneScore));
        domHygieneBar.style.width = hygieneScore + '%';
        domHygieneValue.textContent = hygieneScore;
        // Cambiar aspecto de Mochhichi según higiene
        domChar.classList.remove('dirty');
        if (hygieneScore < 30) domChar.classList.add('dirty');
    }

    // ========== DATOS ==========
    const chapters = [
        { name: 'Rutina Diaria', acts: [
            { title:'El Despertar', speaker:'Mochhichi', dialogue:'¡Buenos días! Tu piel ha acumulado células muertas y bacterias durante la noche. ¿Qué haces primero?',
              fact:'🦠 Dormimos 8h y nuestra piel necesita una limpieza profunda.', minigame:null,
              choices:[ {text:'🧼 Lavarme la cara', correct:true, points:10, feedback:'¡Correcto! Eliminas toxinas y refrescas la piel.'},
                        {text:'📱 Revisar el móvil', correct:false, points:-10, feedback:'El móvil tiene más bacterias que un inodoro.'} ] },
            { title:'Cepillado Dental', speaker:'Dr. Mochi', dialogue:'Es hora de lavarse los dientes. ¿Cuánto tiempo dedicas?',
              fact:'🪥 2 minutos es lo ideal para eliminar la placa bacteriana.', minigame:'drag',
              choices:[ {text:'⏱️ 2 minutos completos', correct:true, points:15, feedback:'¡Perfecto! Así eliminas la placa sin dañar el esmalte.'},
                        {text:'🏃 30 segundos', correct:false, points:-15, feedback:'El 70% de las bacterias se quedan.'} ] },
            { title:'Antes de Comer', speaker:'Mamá Mochi', dialogue:'¡La comida está lista! ¿Qué haces antes de sentarte?',
              fact:'🧼 Lavarse las manos reduce un 50% las enfermedades.', minigame:'tap',
              choices:[ {text:'🧴 Lavarme las manos con jabón', correct:true, points:15, feedback:'Correcto. Eliminas gérmenes al instante.'},
                        {text:'🍽️ Sentarme directamente', correct:false, points:-15, feedback:'Tus manos tocan muchas superficies.'} ] }
        ]},
        { name: 'Ducha y Baño', acts: [
            { title:'Frecuencia de Ducha', speaker:'Mochhichi', dialogue:'¿Con qué frecuencia te duchas?',
              fact:'🚿 La ducha diaria elimina el sudor y las bacterias.', minigame:null,
              choices:[ {text:'🚿 Una vez al día', correct:true, points:10, feedback:'Correcto. Mantiene la piel limpia.'},
                        {text:'📅 Dos veces por semana', correct:false, points:-10, feedback:'No es suficiente.'} ] },
            { title:'Uso de Jabón', speaker:'Mochhichi', dialogue:'¿Qué tipo de jabón usas para tu piel?',
              fact:'🧴 El jabón neutro (pH 5.5) respeta el manto ácido.', minigame:'swipe',
              choices:[ {text:'🧼 Jabón neutro', correct:true, points:10, feedback:'Perfecto. Limpia sin irritar.'},
                        {text:'🧴 Jabón muy perfumado', correct:false, points:-10, feedback:'Los perfumes pueden irritar.'} ] },
            { title:'Secado Correcto', speaker:'Mochhichi', dialogue:'¿Cómo te secas después de la ducha?',
              fact:'🧻 Secar bien los pliegues previene hongos.', minigame:null,
              choices:[ {text:'🧺 Toalla limpia, palmaditas', correct:true, points:10, feedback:'Correcto. Evitas irritaciones.'},
                        {text:'🌬️ Dejarme secar al aire', correct:false, points:-10, feedback:'La humedad invita a los hongos.'} ] }
        ]},
        { name: 'Cuidado Bucal', acts: [
            { title:'Hilo Dental', speaker:'Dra. Mochi', dialogue:'¿Usas hilo dental a diario?',
              fact:'🦷 El hilo dental limpia donde el cepillo no llega.', minigame:null,
              choices:[ {text:'🧵 Sí, a diario', correct:true, points:10, feedback:'¡Excelente! Previenes caries interdentales.'},
                        {text:'🙅 Nunca', correct:false, points:-10, feedback:'El 40% del diente queda sin limpiar.'} ] },
            { title:'Visita al Dentista', speaker:'Dra. Mochi', dialogue:'¿Cada cuánto vas al dentista?',
              fact:'🩺 Cada 6 meses detecta problemas a tiempo.', minigame:'circle',
              choices:[ {text:'📅 Cada 6 meses', correct:true, points:10, feedback:'Correcto. La prevención es clave.'},
                        {text:'🗓️ Solo cuando duele', correct:false, points:-10, feedback:'El dolor indica daño avanzado.'} ] },
            { title:'Cepillado Nocturno', speaker:'Dra. Mochi', dialogue:'¿Por qué es crucial cepillarse antes de dormir?',
              fact:'🌙 Sin saliva, las bacterias atacan el esmalte.', minigame:null,
              choices:[ {text:'🦷 Porque paso 8h sin protección', correct:true, points:10, feedback:'Correcto. El más importante del día.'},
                        {text:'💤 No importa', correct:false, points:-10, feedback:'Un solo cepillado no es suficiente.'} ] }
        ]},
        { name: 'Cuidado de la Piel', acts: [
            { title:'Protector Solar', speaker:'Mochhichi', dialogue:'¿Te aplicas protector solar al salir?',
              fact:'☀️ Previene cáncer de piel y envejecimiento.', minigame:'swipe',
              choices:[ {text:'🧴 Sí, FPS 30+ cada 2h', correct:true, points:10, feedback:'Perfecto. Incluso en días nublados.'},
                        {text:'😎 Solo en verano', correct:false, points:-10, feedback:'Los rayos UV dañan todo el año.'} ] },
            { title:'Hidratación', speaker:'Mochhichi', dialogue:'¿Cómo mantienes tu piel hidratada?',
              fact:'💧 Beber 2L de agua al día es esencial.', minigame:null,
              choices:[ {text:'💦 Agua y crema hidratante', correct:true, points:10, feedback:'Correcto. Hidratación por dentro y fuera.'},
                        {text:'🧴 Solo crema', correct:false, points:-10, feedback:'Sin agua, la piel no se hidrata.'} ] },
            { title:'Limpieza Facial', speaker:'Mochhichi', dialogue:'¿Con qué frecuencia limpias tu rostro?',
              fact:'🧼 Mañana y noche evita poros obstruidos.', minigame:'circle',
              choices:[ {text:'🌅🌙 Dos veces al día', correct:true, points:10, feedback:'Correcto. Elimina grasa y suciedad.'},
                        {text:'🛏️ Solo antes de dormir', correct:false, points:-10, feedback:'Por la mañana también necesitas limpiar.'} ] }
        ]},
        { name: 'Higiene del Sueño', acts: [
            { title:'Horario Fijo', speaker:'Mochhichi', dialogue:'¿Mantienes un horario regular de sueño?',
              fact:'⏰ La rutina mejora la calidad del descanso.', minigame:null,
              choices:[ {text:'🛌 Misma hora siempre', correct:true, points:10, feedback:'Correcto. Tu cuerpo ama las rutinas.'},
                        {text:'🎢 Horarios variables', correct:false, points:-10, feedback:'Confunde al reloj biológico.'} ] },
            { title:'Sin Pantallas', speaker:'Mochhichi', dialogue:'¿Usas pantallas antes de dormir?',
              fact:'📵 La luz azul inhibe la melatonina.', minigame:'tap',
              choices:[ {text:'📴 Lo apago 1h antes', correct:true, points:10, feedback:'Excelente. Tu cerebro se prepara para dormir.'},
                        {text:'📱 Sí, reviso redes', correct:false, points:-10, feedback:'Esa luz engaña a tu cerebro.'} ] },
            { title:'Cena Ligera', speaker:'Mochhichi', dialogue:'¿Qué cenas antes de acostarte?',
              fact:'🥗 Cena ligera 2-3h antes facilita el sueño.', minigame:null,
              choices:[ {text:'🥒 Algo ligero', correct:true, points:10, feedback:'Correcto. Facilita el sueño reparador.'},
                        {text:'🍕 Cena abundante', correct:false, points:-10, feedback:'Digestión pesada interfiere.'} ] }
        ]},
        { name: 'Higiene Mental', acts: [
            { title:'Respiración', speaker:'Mochhichi', dialogue:'Te sientes estresado. ¿Qué haces?',
              fact:'🌬️ Respirar profundo activa el sistema parasimpático.', minigame:null,
              choices:[ {text:'🧘 Respiro lento y profundo', correct:true, points:10, feedback:'Perfecto. Reduce el estrés en minutos.'},
                        {text:'😤 Grito o me enojo', correct:false, points:-10, feedback:'Aumenta el estrés. Mejor respira.'} ] },
            { title:'Hablar con Alguien', speaker:'Mochhichi', dialogue:'¿Compartes tus problemas?',
              fact:'💬 Hablar alivia la carga emocional.', minigame:'drag',
              choices:[ {text:'🗣️ Lo comparto con alguien', correct:true, points:10, feedback:'Correcto. Te sientes apoyado.'},
                        {text:'🤐 Me lo guardo', correct:false, points:-10, feedback:'Guardar emociones afecta la salud mental.'} ] },
            { title:'Celebrar Logros', speaker:'Mochhichi', dialogue:'¿Reconoces tus pequeños logros?',
              fact:'🎯 Valorar tus avances refuerza la autoestima.', minigame:null,
              choices:[ {text:'🎉 Lo celebro', correct:true, points:10, feedback:'¡Bien! Reconocer el esfuerzo motiva.'},
                        {text:'😒 Lo ignoro', correct:false, points:-10, feedback:'Tus logros merecen ser valorados.'} ] }
        ]},
        { name: 'Higiene Íntima', acts: [
            { title:'Ducha Diaria', speaker:'Mochhichi', dialogue:'¿Cada cuánto te duchas para higiene íntima?',
              fact:'🚿 La ducha diaria mantiene la zona limpia y sana.', minigame:null,
              choices:[ {text:'🚿 Cada día', correct:true, points:10, feedback:'Correcto. Previene infecciones.'},
                        {text:'📅 Cada 2-3 días', correct:false, points:-10, feedback:'No es suficiente.'} ] },
            { title:'Ropa Interior', speaker:'Mochhichi', dialogue:'¿Qué tipo de ropa interior es más saludable?',
              fact:'🩲 El algodón transpira mejor.', minigame:'swipe',
              choices:[ {text:'🌿 Algodón, cambio diario', correct:true, points:10, feedback:'Perfecto. Cómodo y saludable.'},
                        {text:'🧵 Sintético, cada 2 días', correct:false, points:-10, feedback:'Retiene humedad y calor.'} ] },
            { title:'Correcto Deshodorante', speaker:'Mochhichi', dialogue:'¿Cada cuanto usas deshodorante?',
              fact:'🧻 Actúa directamente sobre el origen bacteriano para evitar olores desagradables..', minigame:null,
              choices:[ {text:'🧻 Una vez al dia', correct:true, points:10, feedback:'Correcto. Evitas bacterias.'},
                        {text:'🌀 Cada que huelo feo', correct:false, points:-10, feedback:'La dirección incorrecta puede infectar.'} ] }
        ]}
    ];

    // Construir storyData con IDs
    const storyData = {};
    const actIdList = [];
    chapters.forEach((ch, ci) => {
        ch.acts.forEach((act, ai) => {
            const id = `c${ci+1}a${ai+1}`;
            actIdList.push(id);
            storyData[id] = { ...act, id, chapter:ci+1, actNumber:ai+1, chapterTitle:`Cap ${ci+1}: ${ch.name}` };
        });
    });
    actIdList.forEach((id, idx) => {
        storyData[id].next = idx < actIdList.length-1 ? actIdList[idx+1] : 'final';
    });
    storyData['final'] = { id:'final', type:'final' };

    // ========== MINIJUEGOS ==========
    function startMinigame(type, onComplete) {
        mgActive = true; mgType = type; mgScore = 0;
        mgTarget = mgTargets[type] || 5;
        domMgLayer.classList.add('active');
        domMgCounter.textContent = `0/${mgTarget}`;
        domMgProgress.style.width = '0%';
        mgObjects = []; mgDrawingPoints = []; mgTouchStart = null;
        const instructions = {
            tap:'Toca los gérmenes para eliminarlos',
            drag:'Arrastra el cepillo sobre los dientes sucios',
            swipe:'Desliza el dedo para limpiar las manchas',
            circle:'Dibuja círculos alrededor de las manchas',
            shake:'¡Agita el dispositivo!'
        };
        domMgInstr.textContent = instructions[type] || '';
        initMinigameObjects();
        drawMinigame();

        // Eventos
        domMgCanvas.onpointerdown = e => {
            if (!mgActive) return;
            const r = domMgCanvas.getBoundingClientRect();
            const mx = e.clientX - r.left, my = e.clientY - r.top;
            if (mgType === 'tap') handleTap(mx, my);
            else if (mgType === 'drag') startDrag(mx, my);
            else if (mgType === 'swipe') startSwipe(mx, my);
            else if (mgType === 'circle') startCircle(mx, my);
        };
        domMgCanvas.onpointermove = e => {
            if (!mgActive) return;
            const r = domMgCanvas.getBoundingClientRect();
            const mx = e.clientX - r.left, my = e.clientY - r.top;
            if (mgType === 'drag' && mgObjects[0]?.dragging) moveDrag(mx, my);
            else if (mgType === 'swipe' && mgTouchStart) continueSwipe(mx, my);
            else if (mgType === 'circle' && mgTouchStart) continueCircle(mx, my);
        };
        domMgCanvas.onpointerup = () => {
            if (mgType === 'drag') mgObjects[0].dragging = false;
            if (mgType === 'swipe' || mgType === 'circle') mgTouchStart = null;
        };

        // Shake
        if (mgType === 'shake' && window.DeviceMotionEvent) {
            window.addEventListener('devicemotion', shakeHandler);
        }

        function finishMinigame() {
            mgActive = false;
            cancelAnimationFrame(mgAnimId);
            domMgLayer.classList.remove('active');
            if (mgType === 'shake') window.removeEventListener('devicemotion', shakeHandler);
            hygieneScore = Math.min(100, hygieneScore + 5); // Bonus por completar
            updateHygieneUI();
            onComplete();
        }

        function shakeHandler(e) {
            if (!mgActive || mgType !== 'shake') return;
            const acc = e.accelerationIncludingGravity;
            const mag = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
            if (mag > 18) {
                mgScore++;
                domMgCounter.textContent = `${mgScore}/${mgTarget}`;
                domMgProgress.style.width = `${(mgScore/mgTarget)*100}%`;
                if (mgScore >= mgTarget) finishMinigame();
            }
        }
    }

    function initMinigameObjects() {
        mgObjects = [];
        if (mgType === 'tap') {
            for (let i=0; i<mgTarget; i++) {
                mgObjects.push({ x:40+Math.random()*220, y:40+Math.random()*220, r:22+Math.random()*8, active:true,
                    pulse:Math.random()*Math.PI*2, hue:Math.random()*30+340, vx:(Math.random()-0.5)*1.2, vy:(Math.random()-0.5)*1.2 });
            }
        } else if (mgType === 'drag') {
            // Cepillo
            mgObjects.push({ x:240, y:240, w:50, h:25, dragging:false });
            // Dientes sucios
            for (let i=0; i<mgTarget; i++) {
                mgObjects.push({ x:40+i*45, y:120+Math.sin(i)*30, w:30, h:40, dirty:true });
            }
        } else if (mgType === 'swipe' || mgType === 'circle') {
            for (let i=0; i<mgTarget; i++) {
                mgObjects.push({ x:40+Math.random()*220, y:40+Math.random()*220, r:20+Math.random()*10, cleaned:false });
            }
        }
    }

    function handleTap(mx, my) {
        for (let g of mgObjects) {
            if (!g.active) continue;
            if (Math.hypot(mx-g.x, my-g.y) < g.r+10) {
                g.active = false; mgScore++;
                domMgCounter.textContent = `${mgScore}/${mgTarget}`;
                domMgProgress.style.width = `${(mgScore/mgTarget)*100}%`;
                if (mgScore >= mgTarget) finishMinigame();
                return;
            }
        }
    }

    function startDrag(mx, my) {
        const brush = mgObjects[0];
        if (mx > brush.x && mx < brush.x+brush.w && my > brush.y && my < brush.y+brush.h) {
            brush.dragging = true;
        }
    }

    function moveDrag(mx, my) {
        const brush = mgObjects[0];
        brush.x = Math.max(0, Math.min(250, mx - brush.w/2));
        brush.y = Math.max(0, Math.min(275, my - brush.h/2));
        for (let i=1; i<mgObjects.length; i++) {
            const tooth = mgObjects[i];
            if (!tooth.dirty) continue;
            const cx = brush.x + brush.w/2, cy = brush.y + brush.h/2;
            const tx = tooth.x + tooth.w/2, ty = tooth.y + tooth.h/2;
            if (Math.abs(cx-tx) < (brush.w+tooth.w)/2 && Math.abs(cy-ty) < (brush.h+tooth.h)/2) {
                tooth.dirty = false; mgScore++;
                domMgCounter.textContent = `${mgScore}/${mgTarget}`;
                domMgProgress.style.width = `${(mgScore/mgTarget)*100}%`;
                if (mgScore >= mgTarget) finishMinigame();
            }
        }
    }

    function startSwipe(mx, my) { mgTouchStart = {x:mx, y:my}; }
    function continueSwipe(mx, my) {
        for (let o of mgObjects) {
            if (o.cleaned) continue;
            if (Math.hypot(mx-o.x, my-o.y) < o.r+15) {
                o.cleaned = true; mgScore++;
                domMgCounter.textContent = `${mgScore}/${mgTarget}`;
                domMgProgress.style.width = `${(mgScore/mgTarget)*100}%`;
                if (mgScore >= mgTarget) finishMinigame();
            }
        }
    }

    function startCircle(mx, my) { mgTouchStart = {x:mx, y:my}; mgDrawingPoints = [{x:mx, y:my}]; }
    function continueCircle(mx, my) {
        mgDrawingPoints.push({x:mx, y:my});
        for (let o of mgObjects) {
            if (o.cleaned) continue;
            // Verificar si el dibujo envuelve el objeto
            if (mgDrawingPoints.length > 10 && isCircleAround(mgDrawingPoints, o)) {
                o.cleaned = true; mgScore++;
                mgDrawingPoints = [];
                domMgCounter.textContent = `${mgScore}/${mgTarget}`;
                domMgProgress.style.width = `${(mgScore/mgTarget)*100}%`;
                if (mgScore >= mgTarget) finishMinigame();
            }
        }
    }

    function isCircleAround(points, obj) {
        let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
        points.forEach(p => { minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
        return obj.x > minX && obj.x < maxX && obj.y > minY && obj.y < maxY;
    }

    function drawMinigame() {
        if (!mgActive) return;
        mgCtx.clearRect(0,0,300,300);
        if (mgType === 'tap') {
            mgObjects.forEach(g => {
                if (!g.active) return;
                g.x += g.vx; g.y += g.vy;
                if (g.x<20||g.x>280) g.vx*=-1;
                if (g.y<20||g.y>280) g.vy*=-1;
                g.pulse += 0.06;
                const pr = g.r + Math.sin(g.pulse)*4;
                const grad = mgCtx.createRadialGradient(g.x,g.y,pr*0.1,g.x,g.y,pr);
                grad.addColorStop(0,`hsla(${g.hue},90%,70%,1)`);
                grad.addColorStop(1,`hsla(${g.hue},90%,40%,0.2)`);
                mgCtx.beginPath(); mgCtx.arc(g.x,g.y,pr,0,Math.PI*2); mgCtx.fillStyle=grad; mgCtx.fill();
                mgCtx.strokeStyle='#fff'; mgCtx.lineWidth=2; mgCtx.stroke();
                mgCtx.fillStyle='#fff';
                mgCtx.beginPath(); mgCtx.arc(g.x-pr*0.3,g.y-pr*0.2,pr*0.12,0,Math.PI*2); mgCtx.fill();
                mgCtx.beginPath(); mgCtx.arc(g.x+pr*0.3,g.y-pr*0.2,pr*0.12,0,Math.PI*2); mgCtx.fill();
            });
        } else if (mgType === 'drag') {
            // Dientes
            for (let i=1; i<mgObjects.length; i++) {
                const t = mgObjects[i];
                mgCtx.fillStyle = t.dirty ? '#f0e68c' : '#fff';
                mgCtx.fillRect(t.x, t.y, t.w, t.h);
                mgCtx.strokeStyle = '#333'; mgCtx.strokeRect(t.x, t.y, t.w, t.h);
            }
            // Cepillo
            const b = mgObjects[0];
            mgCtx.fillStyle = '#f9d423';
            mgCtx.fillRect(b.x, b.y, b.w, b.h);
            mgCtx.fillStyle = '#fff';
            mgCtx.font = '14px Comfortaa';
            mgCtx.fillText('🪥', b.x+10, b.y+18);
        } else if (mgType === 'swipe' || mgType === 'circle') {
            mgObjects.forEach(o => {
                mgCtx.beginPath();
                mgCtx.arc(o.x, o.y, o.r, 0, Math.PI*2);
                mgCtx.fillStyle = o.cleaned ? '#2ecc71' : '#e74c3c';
                mgCtx.fill();
                mgCtx.strokeStyle = '#fff'; mgCtx.stroke();
            });
            if (mgType === 'circle' && mgDrawingPoints.length > 1) {
                mgCtx.beginPath();
                mgCtx.moveTo(mgDrawingPoints[0].x, mgDrawingPoints[0].y);
                for (let i=1; i<mgDrawingPoints.length; i++) mgCtx.lineTo(mgDrawingPoints[i].x, mgDrawingPoints[i].y);
                mgCtx.strokeStyle = '#f9d423'; mgCtx.lineWidth=3; mgCtx.stroke();
            }
        }
        mgAnimId = requestAnimationFrame(drawMinigame);
    }

    function finishMinigame() {
        mgActive = false;
        cancelAnimationFrame(mgAnimId);
        domMgLayer.classList.remove('active');
        if (mgType === 'shake') window.removeEventListener('devicemotion', shakeHandler);
        hygieneScore = Math.min(100, hygieneScore + 5);
        updateHygieneUI();
        if (mgOnComplete) mgOnComplete();
    }
    let mgOnComplete;

    // ========== FLUJO DEL JUEGO ==========
    function showAct() {
        if (gameFinished) return;
        const act = storyData[currentActId];
        if (!act || act.type === 'final') { showFinal(); return; }
        actInProgress = false;
        domTag.textContent = `${act.chapterTitle} · Acto ${act.actNumber}`;
        domSpeaker.textContent = act.speaker;
        typeWriter(act.dialogue);
        domChar.classList.remove('bounce','sad','celebrate','dirty');
        domChar.classList.add('bounce');
        if (act.fact) { domFactText.textContent = act.fact; domFactBox.classList.add('show'); }
        else domFactBox.classList.remove('show');
        domChoices.innerHTML = '';
        act.choices.forEach((c, i) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn glass';
            btn.innerHTML = `<span>${c.text.split(' ')[0]}</span> ${c.text.substring(c.text.indexOf(' ')+1)}`;
            btn.onclick = () => handleChoice(act, i, btn);
            domChoices.appendChild(btn);
        });
    }

    function typeWriter(text, i=0) {
        if (i===0) domDialogue.innerHTML = '';
        if (i < text.length) {
            domDialogue.innerHTML += text.charAt(i);
            setTimeout(() => typeWriter(text, i+1), 15);
        }
    }

    function handleChoice(act, idx, btn) {
        if (actInProgress || gameFinished) return;
        actInProgress = true;
        const choice = act.choices[idx];
        const btns = domChoices.querySelectorAll('.choice-btn');
        btns.forEach((b, i) => {
            b.disabled = true;
            if (i === idx && choice.correct) b.classList.add('correct');
            else if (i === idx && !choice.correct) b.classList.add('incorrect');
            if (i !== idx && act.choices[i].correct) b.classList.add('correct');
        });
        const fb = document.createElement('div');
        fb.className = 'feedback-msg';
        fb.textContent = (choice.correct ? '✅ ' : '❌ ') + choice.feedback;
        domChoices.insertBefore(fb, domChoices.firstChild);
        domChar.classList.remove('bounce','sad','celebrate');
        domChar.classList.add(choice.correct ? 'celebrate' : 'sad');
        hygieneScore += choice.points;
        updateHygieneUI();
        decisionsLog.push({ act:act.id, choice:idx, correct:choice.correct });
        saveToAppInventor();

        if (choice.correct && act.minigame) {
            mgOnComplete = () => advanceAct();
            startMinigame(act.minigame, mgOnComplete);
        } else {
            setTimeout(() => advanceAct(), 2500);
        }
    }

    function advanceAct() {
        completedActs++;
        domCompleted.textContent = completedActs;
        saveToAppInventor();
        if (completedActs >= TOTAL_ACTS) { showFinal(); return; }
        currentActId = storyData[currentActId].next;
        showAct();
    }

    function showFinal() {
        gameFinished = true;
        domFinal.classList.add('active');
        let title, msg;
        if (hygieneScore >= 80) {
            title = '🌟 ¡Mochhichi Súper Higiénico!';
            msg = '¡Eres un experto en higiene personal! Tu rutina es impecable y tu salud te lo agradece. Hazle click a "volver al menu" para volver';
        } else if (hygieneScore >= 50) {
            title = '👍 Buen trabajo, Mochhichi';
            msg = 'Tienes buenos hábitos, pero aún puedes mejorar algunos aspectos. ¡Sigue aprendiendo!. Hazle click a "volver al menu" para volver';
        } else {
            title = '😟 Mochhichi necesita mejorar';
            msg = 'Tu higiene personal tiene carencias importantes. Revisa los consejos y cuida tu salud. Hazle click a "volver al menu" para volver';
        }
        domFinalTitle.textContent = title;
        domFinalMsg.textContent = msg;
        domFinalHygiene.textContent = hygieneScore;
        saveToAppInventor();
    }

    window.onload = () => {
        if (!loadFromAppInventor()) {
            currentActId = actIdList[0];
            completedActs = 0;
            hygieneScore = 50;
            decisionsLog = [];
        }
        domCompleted.textContent = completedActs;
        updateHygieneUI();
        showAct();
    };
</script>
